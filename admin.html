<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运营后台 · 红色文化传播网</title>
    
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/noto-sans-sc-400.woff2?v=20260901a" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=20260901a">
<link rel="stylesheet" href="assets/css/admin.css?v=20260901c"><link rel="stylesheet" href="assets/css/inline-attrs.css?v=20260901c"></head>
  <body>
    <header>红色文化传播网 · 运营后台</header>

    <!-- 登录 -->
    <div id="loginBox" class="card">
      <h2>管理员登录</h2>
      <p class="muted">请输入管理员令牌（由技术负责人提供，仅本次会话保存在浏览器内存）。</p>
      <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN" />
      <div class="login-err hidden" id="loginErr"></div>
      <div class="s-8fb59671">>
        <button class="btn-primary" id="loginBtn">登录</button>
      </div>
    </div>

    <!-- 主区 -->
    <div id="mainBox" class="wrap hidden">
      <div class="tabs">
        <div class="tab active" data-tab="words">敏感词管理</div>
        <div class="tab" data-tab="corrections">纠错审核</div>
      </div>

      <!-- 敏感词 -->
      <div id="tab-words" class="card">
        <h2>敏感词管理</h2>
        <div class="row">
          <div><label class="muted">新增敏感词</label><input id="newWord" placeholder="如：某违规词" /></div>
          <div><label class="muted">分类</label><input id="newWordCat" placeholder="如：历史虚无主义" value="运营新增" /></div>
          <div class="s-6040c8ca">>
            <button class="btn-primary" id="addWordBtn">添加（待审核）</button>
          </div>
        </div>
        <p class="muted">新增词默认 <span class="tag tag-pending">pending</span>，需审核通过后才会进入生效词库（AI 拦截）。</p>
        <table id="wordTable">
          <thead><tr><th>敏感词</th><th>分类</th><th>状态</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- 纠错 -->
      <div id="tab-corrections" class="card hidden">
        <h2>用户纠错审核</h2>
        <div class="row" class="s-c58d5bea">>
          <div class="s-6040c8ca">>
            <select id="corrFilter">
              <option value="">全部</option>
              <option value="pending">待处理</option>
              <option value="resolved">已处理</option>
              <option value="rejected">已驳回</option>
            </select>
          </div>
          <div class="s-6040c8ca">><button class="btn-ghost" id="corrRefresh">刷新</button></div>
        </div>
        <table id="corrTable">
          <thead><tr><th>类型</th><th>相关史料</th><th>问题描述</th><th>联系方式</th><th>状态</th><th>处理</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  <script src="api-client.js?v=20260902c"></script>
    <script src="assets/js/admin.inline1.js?v=20260901d"></script>
  </body>
</html>
