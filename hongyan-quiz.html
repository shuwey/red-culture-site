}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;

.page-head{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;padding:22px 18px 18px}

.wrap{max-width:960px;margin:0 auto;padding:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}

select,.btn{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:#fff}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}

.tag.d1{background:#eafaf0;color:var(--grn);border-color:#c7ecd3}
.tag.d2{background:#fff4e3;color:var(--amb);border-color:#f4dcb4}
.tag.d3{background:#fdeaea;color:#b3243a;border-color:#f3c4c4}
.qno{font-size:12px;color:var(--mut);margin-left:auto}
.stem{font-size:15px;margin:4px 0 10px;font-weight:600}
.stem .blank{display:inline-block;min-width:70px;border-bottom:2px dotted var(--red);color:var(--red)}
.opts{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.opt{text-align:left;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fffdfc;cursor:pointer;transition:.12s}
.opt:hover{border-color:#e7a99c}
.opt.sel{border-color:var(--red);background:#fff2ef}
.opt.right{background:#eafaf0;border-color:var(--grn);color:#15633a}
.opt.wrong{background:#fdeaea;border-color:#d9534f;color:#9b1c1c}
.opt.miss{background:#fff7e6;border-color:var(--amb);color:#8a5a00}
.fillin{width:100%;max-width:420px;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin:4px 0}
.submit,.reveal{margin-top:6px;font:inherit;font-size:13px;padding:8px 16px;border-radius:9px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer}
.reveal{background:#fff;color:var(--red)}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;background:#fbf3f0;border:1px solid #f1d8cf;font-size:13.5px;display:none}
.fb.show{display:block}
.fb .res{font-weight:700;margin-bottom:4px}
.fb .ans{color:var(--red-d);margin:4px 0}
.fb .an{color:var(--ink)}
.fb.ok{border-color:#c7ecd3;background:#f1faf4}
.fb.no{border-color:#f3c4c4;background:#fdeeee}
.fb .ref{margin-top:8px;padding:8px 10px;background:#fff7e6;border:1px solid #f4dcb4;border-radius:8px;color:#8a5a00;font-size:13px;line-height:1.65}
.empty{text-align:center;color:var(--mut);padding:40px 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px}
@media(max-width:560px){.page-head h1{font-size:19px}.stat{min-width:45%}}

const DATA = [{"id": "q001", "type": "single", "cat": "basic", "diff": 1, "stem": "长篇小说《红岩》的作者是？", "options": [{"k": "A", "v": "罗广斌、杨益言"}, {"k": "B", "v": "罗广斌、刘德彬"}, {"k": "C", "v": "杨益言、刘德彬"}, {"k": "D", "v": "罗广斌、杨益言、刘德彬"}], "answer": "A", "analysis": "《红岩》由罗广斌、杨益言合著。刘德彬是早期回忆录的合作者之一，但小说正式署名仅罗、杨二人。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q002", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》首次出版于何时、由哪家出版社出版？", "options": [{"k": "A", "v": "1959年，人民文学出版社"}, {"k": "B", "v": "1961年12月，中国青年出版社"}, {"k": "C", "v": "1961年12月，作家出版社"}, {"k": "D", "v": "1957年，重庆出版社"}], "answer": "B", "analysis": "《红岩》于1961年12月由中国青年出版社正式出版，是向新中国成立十周年的献礼作品。", "ref": "回书指引：1949.10.1 新中国成立，消息传到狱中后难友缝制五星红旗，见第25章。（原书第25章）"}, {"id": "q003", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》是一部什么题材的长篇小说？", "options": [{"k": "A", "v": "武侠小说"}, {"k": "B", "v": "科幻小说"}, {"k": "C", "v": "革命历史小说"}, {"k": "D", "v": "言情小说"}], "answer": "C", "analysis": "《红岩》是罗广斌、杨益言根据自身狱中经历创作的革命历史题材长篇小说。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q004", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》全书共有多少章？", "options": [{"k": "A", "v": "二十章"}, {"k": "B", "v": "二十五章"}, {"k": "C", "v": "三十章"}, {"k": "D", "v": "四十章"}], "answer": "C", "analysis": "《红岩》全书共三十章，描写重庆解放前夕的地下斗争与狱中斗争。", "ref": "回书指引：1949.11.30 重庆解放，距“11·27”仅3天，见第29—30章解放军炮声与越狱成功。（原书第29—30章）"}, {"id": "q005", "type": "single", "cat": "basic", "diff": 1, "stem": "小说《红岩》在创作前的雏形、前身是哪部革命回忆录？", "options": [{"k": "A", "v": "《圣洁的血花》"}, {"k": "B", "v": "《在烈火中永生》"}, {"k": "C", "v": "《禁锢的世界》"}, {"k": "D", "v": "以上都对"}], "answer": "D", "analysis": "《红岩》历经《圣洁的血花》(1950)、《在烈火中永生》(1959)、《禁锢的世界》(初稿名)等阶段，最终定名《红岩》。", "ref": "回书指引：电影《烈火中永生》据《红岩》改编，可作为跨媒介延伸阅读。（原书全书（跨媒介））"}, {"id": "q006", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》的两位作者曾因何被关押？", "options": [{"k": "A", "v": "因参加革命活动于1948年先后被捕，囚于渣滓洞、白公馆"}, {"k": "B", "v": "因经济犯罪被捕"}, {"k": "C", "v": "因写文章被错划右派"}, {"k": "D", "v": "抗战中被日军俘虏"}], "answer": "A", "analysis": "罗广斌、杨益言因参加革命活动于1948年先后被捕，亲历渣滓洞、白公馆狱中斗争，是幸存者。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q007", "type": "single", "cat": "basic", "diff": 1, "stem": "重庆解放前夕，两位作者的结局是？", "options": [{"k": "A", "v": "均被杀害"}, {"k": "B", "v": "罗广斌成功越狱，杨益言被营救出狱"}, {"k": "C", "v": "均成功越狱"}, {"k": "D", "v": "均被营救出狱"}], "answer": "B", "analysis": "罗广斌在1949年'11·27'大屠杀之夜越狱脱险，杨益言被营救出狱，二人均为幸存者。", "ref": "回书指引：“11·27”大屠杀发生于 1949.11.27，距重庆解放仅3天、约207人遇难，小说分布于第25章（提前密裁）、第28—30章（大屠杀与越狱）。（原书第25、28—30章）"}, {"id": "q008", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》书名源自什么？", "options": [{"k": "A", "v": "重庆歌乐山的一处红色岩石"}, {"k": "B", "v": "抗日战争时期中共在重庆的八路军办事处所在地'红岩'"}, {"k": "C", "v": "作者家乡地名"}, {"k": "D", "v": "虚构的地名"}], "answer": "B", "analysis": "书名取自抗战时期中共南方局、八路军重庆办事处所在地'红岩村'，象征国统区斗争的精神坐标。", "ref": "回书指引：红岩村是抗战时期八路军重庆办事处、南方局所在地，为书名来源，背景见第1章及书名寓意。（原书第1章（书名来源/背景））"}, {"id": "q009", "type": "single", "cat": "basic", "diff": 2, "stem": "2019年，《红岩》入选了哪一项国家级书目？", "options": [{"k": "A", "v": "'十三五'重点出版物"}, {"k": "B", "v": "'新中国70年70部长篇小说典藏'"}, {"k": "C", "v": "'五个一工程'奖"}, {"k": "D", "v": "茅盾文学奖"}], "answer": "B", "analysis": "2019年，《红岩》入选'新中国70年70部长篇小说典藏'。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q010", "type": "single", "cat": "basic", "diff": 1, "stem": "《红岩》故事发生的历史时期是？", "options": [{"k": "A", "v": "抗日战争时期"}, {"k": "B", "v": "解放战争后期、重庆解放前夕"}, {"k": "C", "v": "土地革命时期"}, {"k": "D", "v": "建国初期"}], "answer": "B", "analysis": "小说以1948年前后解放战争后期、重庆'黎明前的白色恐怖'为历史背景。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q011", "type": "single", "cat": "basic", "diff": 2, "stem": "引发重庆地下党组织被破坏、大批同志被捕的导火索事件是？", "options": [{"k": "A", "v": "《新华日报》事件"}, {"k": "B", "v": "《挺进报》事件"}, {"k": "C", "v": "沙坪书店事件"}, {"k": "D", "v": "华蓥山起义"}], "answer": "B", "analysis": "国民党西南长官公署限期破获《挺进报》，由此引发连锁破坏，是地下党组织遭重创的直接导火索。", "ref": "回书指引：《挺进报》第3章由成岗接手印刷、第10章山城再现、第20章白公馆狱中版、第22章“白宫版”泄露，其被破坏是全书导火索。（原书第3、10、20、22章）"}, {"id": "q012", "type": "single", "cat": "basic", "diff": 1, "stem": "下列人物中，属于小说中的反面角色（国民党特务）的是？", "options": [{"k": "A", "v": "徐鹏飞"}, {"k": "B", "v": "李敬原"}, {"k": "C", "v": "成岗"}, {"k": "D", "v": "刘思扬"}], "answer": "A", "analysis": "徐鹏飞是小说中的军统特务头子，原型为徐远举；其余均为正面革命者。", "ref": "回书指引：徐鹏飞（原型徐远举）：第6章慈居登场、第9—10章审讯与庆功宴、第17章应对学潮、第21—22章密裁计划、第26—28章至第30章覆灭。（原书第6、9—10、17、21—22、26—28、30章）"}, {"id": "q013", "type": "single", "cat": "basic", "diff": 2, "stem": "罗广斌脱险后写下的、包含'狱中八条'的重要报告是？", "options": [{"k": "A", "v": "《关于重庆组织破坏经过和狱中情形的报告》"}, {"k": "B", "v": "《在烈火中永生》"}, {"k": "C", "v": "《红岩》创作札记"}, {"k": "D", "v": "《圣洁的血花》"}], "answer": "A", "analysis": "罗广斌1949年12月25日上报《重庆党组织破坏经过和狱中情形的报告》，其第七部分即'狱中八条'。", "ref": "回书指引：“狱中八条”出自罗广斌 1949.12.25 提交的《报告》第七部分，可结合第25—30章就义与越狱情节延伸阅读报告原文。（原书第25—30章（尾声反思））"}, {"id": "q014", "type": "single", "cat": "basic", "diff": 3, "stem": "《红岩》的创作方式在当代文学史上有何特殊意义？", "options": [{"k": "A", "v": "纯个人创作"}, {"k": "B", "v": "国家文学生产与政治体制结合、集体协作的'组织生产'范例"}, {"k": "C", "v": "翻译作品"}, {"k": "D", "v": "改编自话剧"}], "answer": "B", "analysis": "《红岩》是在组织关怀与多位作家、老同志参与下集体打磨而成，被视为当代文学'组织生产'的成功实践。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q015", "type": "fill", "cat": "basic", "diff": 1, "stem": "《红岩》的两位作者是______和______。", "options": null, "answer": "罗广斌、杨益言", "analysis": "《红岩》由罗广斌、杨益言合著，二人均为渣滓洞、白公馆大屠杀幸存者。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q016", "type": "fill", "cat": "basic", "diff": 1, "stem": "《红岩》于______年______月由中国青年出版社正式出版。", "options": null, "answer": "1961年12月", "analysis": "小说《红岩》1961年12月由中国青年出版社正式出版。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q017", "type": "fill", "cat": "basic", "diff": 1, "stem": "《红岩》全书共______章。", "options": null, "answer": "30", "analysis": " , "diff": 1, "stem": "敌人为了逼供江姐，使用了令人发指的酷刑，其中最具代表性的是？", "options": [{"k": "A", "v": "把竹签钉进她的十指"}, {"k": "B", "v": "灌辣椒水"}, {"k": "C", "v": "坐老虎凳"}, {"k": "D", "v": "吊起来鞭打"}], "answer": "A", "analysis": "小说中'竹签钉进十指'是江姐受刑的经典描写，象征其坚贞不屈。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q025", "type": "single", "cat": "people", "diff": 2, "stem": "江姐（江竹筠）被捕的时间与地点大致是？", "options": [{"k": "A", "v": "1948年6月，万县（今重庆万州）"}, {"k": "B", "v": "1949年，重庆朝天门"}, {"k": "C", "v": "1947年，华蓥山"}, {"k": "D", "v": "1948年，渣滓洞"}], "answer": "A", "analysis": "江竹筠于1948年6月在万县（今重庆万州）被捕，后转押重庆。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q026", "type": "single", "cat": "people", "diff": 2, "stem": "江姐（江竹筠）牺牲于何时何地？", "options": [{"k": "A", "v": "1949年11月14日，电台岚垭"}, {"k": "B", "v": "1949年10月28日，大坪"}, {"k": "C", "v": "1949年11月27日，渣滓洞"}, {"k": "D", "v": "1949年9月，戴公祠"}], "answer": "A", "analysis": "江竹筠于1949年11月14日在重庆电台岚垭英勇就义（'11·14'大屠杀）。", "ref": "回书指引：江竹筠等烈士 1949.11.14 在电台岚垭就义（“11·14”大屠杀），对应第25章江姐就义。（原书第25章）"}, {"id": "q027", "type": "single", "cat": "people", "diff": 1, "stem": "小说中负责印刷《挺进报》、在狱中写下《我的'自白'书》的人物是？", "options": [{"k": "A", "v": "许云峰"}, {"k": "B", "v": "成岗"}, {"k": "C", "v": "刘思扬"}, {"k": "D", "v": "华子良"}], "answer": "B", "analysis": "成岗负责《挺进报》的印刷，其原型陈然在狱中写下《我的'自白'书》。", "ref": "回书指引：成岗：第3章接手印刷《挺进报》、第8章被捕、第9章受审写下《我的“自白”书》、第19—20章在白公馆战胜“诚实剂”并办《挺进报》、第22—24章参与狱中斗争。（原书第3、8—9、19—20、22—24章）"}, {"id": "q028", "type": "single", "cat": "people", "diff": 2, "stem": "成岗的历史原型陈然牺牲于何时何地？", "options": [{"k": "A", "v": "1949年11月14日，电台岚垭"}, {"k": "B", "v": "1949年10月28日，大坪刑场"}, {"k": "C", "v": "1949年11月27日，渣滓洞"}, {"k": "D", "v": "1948年7月，重庆"}], "answer": "B", "analysis": "陈然于1949年10月28日在重庆大坪刑场就义，年仅26岁。", "ref": "回书指引：陈然等烈士 1949.10.28 在重庆大坪刑场就义（史实），小说中对应第8—9章成岗受审与就义前情节。（原书第8—9章（对应成岗受审））"}, {"id": "q029", "type": "single", "cat": "people", "di 丈夫彭松涛头颅后强忍悲痛、继承遗志；②面对竹签钉指等酷刑坚贞不屈；③关怀同志、传承革命经验。她集中体现了坚定信念、视死如归、温柔而刚强的红岩精神。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q161", "type": "short", "cat": "people", "diff": 2, "stem": "许云峰在小说中有哪些关键情节？表现了怎样的精神？", "options": null, "answer": "许云峰是地下党工运书记：①识破甫志高叛变、通知转移；②被捕后拒绝利诱、坚不吐实；③在监狱地牢用手指与铁镣挖通秘密通道，自己牺牲却为战友留下生机。表现其政治敏锐、临危不乱、自我牺牲的精神。", "analysis": "许云峰是地下党工运书记：①识破甫志高叛变、通知转移；②被捕后拒绝利诱、坚不吐实；③在监狱地牢用手指与铁镣挖通秘密通道，自己牺牲却为战友留下生机。表现其政治敏锐、临危不乱、自我牺牲的精神。", "ref": "回书指引：许云峰：第7章识破郑克昌、第8章被捕、第9章受审、第10章智对庆功宴、第12章抬入牢房高唱《国际歌》、第16章被转移、第24章地窖挖暗道、第28章从容就义。（原书第7—10、12、16、24、28章）"}, {"id": "q162", "type": "short", "cat": "event", "diff": 2, "stem": "简述'11·27'大屠杀的历史背景与意义。", "options": null, "answer": "'11·27'大屠杀发生于1949年11月27日，重庆解放前3天。国民党特务在渣滓洞、白公馆疯狂屠杀关押的革命者，约200余人遇难。它既是反动派垂死挣扎的暴行，也反衬出先烈为迎接黎明而慷慨赴死的壮烈。", "analysis": "'11·27'大屠杀发生于1949年11月27日，重庆解放前3天。国民党特务在渣滓洞、白公馆疯狂屠杀关押的革命者，约200余人遇难。它既是反动派垂死挣扎的暴行，也反衬出先烈为迎接黎明而慷慨赴死的壮烈。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q163", "type": "short", "cat": "spirit", "diff": 2, "stem": "什么是'狱中八条'？它为何被称为'血与泪的政治嘱托'？", "options": null, "answer": "'狱中八条'出自罗广斌1949年12月25日提交的《重庆党组织破坏经过和狱中情形的报告》第七部分，内容为：防止领导腐化、加强教育锻炼、不迷信上级、注意路线、切勿轻视敌人、重视作风、严格整党整风、惩办叛徒特务。它是烈士在黑牢中用生命总结的党建教训，故称血泪嘱托。", "analysis": "'狱中八条'出自罗广斌1949年12月25日提交的《重庆党组织破坏经过和狱中情形的报告》第七部分，内容为：防止领导腐化、加强教育锻炼、不迷信上级、注意路线、切勿轻视敌人、重视作风、严格整党整风、惩办叛徒特务。它是烈士在黑牢中用生命总结的党建教训，故称血泪嘱托。", "ref": "回书指引：“狱中八条”出自罗广斌 1949.12.25 提交的《报告》第七部分，可结合第25—30章就义与越狱情节延伸阅读报告原文。（原书第25—30章（尾声反思））"}, {"id": "q164", "type": "short", "cat": "spirit", "diff": 1, "stem": "请用一两句话概括'红岩精神'。", "options": null, "answer": "红岩精神是解放战争时期被关押在渣滓洞、白公馆的共产党人，在酷刑与死亡面前不折不挠、宁死不屈，凝结成的坚定理想信念、爱国主义、团结奉献与牺牲精神。", "analysis": "红岩精神是解放战争时期被关押在渣滓洞、白公馆的共产党人，在酷刑与死亡面前不折不挠、宁死不屈，凝结成的坚定理想信念、爱国主义、团结奉献与牺牲精神。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q165", "type": "short", "cat": "art", "diff": 3, "stem": "《红岩》在艺术上如何处理'真实'与'虚构'的关系？", "options": null, "answer": "《红岩》以真实历史事件（如地下党被破坏、'11·27'大屠杀）与真实人物原型（江竹筠、陈然、许建业等）为基础，在'历史的文学化'中进行了典型化、综合化与艺术虚构（如甫志高、许云峰为多个原型糅合），实现了传奇性与纪实性的统一。", "analysis": "《红岩》以真实历史事件（如地下党被破坏、'11·27'大屠杀）与真实人物原型（江竹筠、陈然、许建业等）为基础，在'历史的文学化'中进行了典型化、综合化与艺术虚构（如甫志高、许云峰为多个原型糅合），实现了传奇性与纪实性的统一。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q166", "type": "short", "cat": "event", "diff": 2, "stem": "简述《挺进报》在小说与史实中的意义。", "options": null, "answer": "《挺进报》创刊于1947年5月，由重庆地下党秘密出版，陈然（成岗原型）负责印刷。它是向敌占区'攻心'的宣传武器，其被破坏直接引发地下党组织大破坏，是全书矛盾的导火索之一。", "analysis": "《挺进报》创刊于1947年5月，由重庆地下党秘密出版，陈然（成岗原型）负责印刷。它是向敌占区'攻心'的宣传武器，其被破坏直接引发地下党组织大破坏，是全书矛盾的导火索之一。", "ref": "回书指引：成岗：第3章接手印刷《挺进报》、第8章被捕、第9章受审写下《我的“自白”书》、第19—20章在白公馆战胜“诚实剂”并办《挺进报》、第22—24章参与狱中斗争。（原书第3、8—9、19—20、22—24章）"}, {"id": "q167", "type": "short", "cat": "people", "diff": 3, "stem": "为什么说'甫志高'是艺术综合形象而非单一真人？", "options": null, "answer": "历史上出卖组织的第一个叛徒是任达哉，随后又有刘国定、冉益智等相继叛变，均对组织造成毁灭性破坏。小说将多个叛徒的特征糅合为'甫志高'这一典型形象，以集中表现小资产阶级软弱、个人主义导致背叛的必然性，并非对应某一位具体真人。", "analysis": "历史上出卖组织的第一个叛徒是任达哉，随后又有刘国定、冉益智等相继叛变，均对组织造成毁灭性破坏。小说将多个叛徒的特征糅合为'甫志高'这一典型形象，以集中表现小资产阶级软弱、个人主义导致背叛的必然性，并非对应某一位具体真人。", "ref": "回书指引：甫志高：第1—2章擅自开沙坪书店、第5章引狼入室、第7章不听劝告、第8章叛变出卖同志、第14章出卖江姐，是全书矛盾引爆点。（原书第1—8、14章）"}, {"id": "q168", "type": "short", "cat": "event", "diff": 3, "stem": "小说结尾'越狱'与史实中罗广斌脱险有何联系与区别？", "options": null, "answer": "联系：均发生于'11·27'大屠杀之夜，依靠看守动摇（史实为杨钦典开门，小说为里应外合）脱险。区别：史实是罗广斌等19人趁部分枪手调往渣滓洞时由杨钦典放走；小说艺术化为集体越狱、齐晓轩等掩护牺牲，更具戏剧张力与象征意义。", "analysis": "联系：均发生于'11·27'大屠杀之夜，依靠看守动摇（史实为杨钦典开门，小说为里应外合）脱险。区别：史实是罗广斌等19人趁部分枪手调往渣滓洞时由杨钦典放走；小说艺术化为集体越狱、齐晓轩等掩护牺牲，更具戏剧张力与象征意义。", "ref": "回书指引：齐晓轩：第18章由老大哥介绍、第20—24章白公馆斗争、第22章保护胡浩担责、第28章筹划越狱、第30章断后挺立岩石牺牲。（原书第18、20—24、28、30章）"}, {"id": "q169", "type": "short", "cat": "place", "diff": 2, "stem": "请说明'渣滓洞''白公馆''华蓥山'在《红岩》中的不同作用。", "options": null, "answer": "渣滓洞、白公馆是关押与迫害革命者的集中营，是狱中斗争的主舞台；华蓥山是华蓥山游击纵队根据地，代表狱外武装斗争，双枪老太婆、彭松涛在此活动，三者共同构成'狱内—狱外'的斗争空间。", "analysis": "渣滓洞、白公馆是关押与迫害革命者的集中营，是狱中斗争的主舞台；华蓥山是华蓥山游击纵队根据地，代表狱外武装斗争，双枪老太婆、彭松涛在此活动，三者共同构成'狱内—狱外'的斗争空间。", "ref": "回书指引：彭松涛（江姐丈夫、华蓥山纵队政委）牺牲于第4章，江姐见其头颅后强忍悲痛继续完成任务，是人物动机的重要铺垫。（原书第4章）"}, {"id": "q170", "type": "single", "cat": "basic", "diff": 2, "stem": "《红岩》的成书过程历时约多久？", "options": [{"k": "A", "v": "近10年"}, {"k": "B", "v": "1年"}, {"k": "C", "v": "3个月"}, {"k": "D", "v": "20年"}], "answer": "A", "analysis": "从酝酿到成书历时近10年，经历多次返工、大改，成书40万字、底稿近300万字。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q171", "type": "single", "cat": "people", "diff": 2, "stem": "成岗的妹妹成瑶在革命中的转变体现了？", "options": [{"k": "A", "v": "青年在党的引导下逐步成长"}, {"k": "B", "v": "青年走向堕落"}, {"k": "C", "v": "青年叛变"}, {"k": "D", "v": "与革命无关"}], "answer": "A", "analysis": "成瑶从受哥哥影响的进步青年，成长为化名记者'陈静'的地下工作者，体现青年成长主题。", "ref": "回书指引：成岗：第3章接手印刷《挺进报》、第8章被捕、第9章受审写下《我的“自白”书》、第19—20章在白公馆战胜“诚实剂”并办《挺进报》、第22—24章参与狱中斗争。（原书第3、8—9、19—20、22—24章）"}, {"id": "q172", "type": "single", "cat": "people", "diff": 3, "stem": "小说中'孙明霞'这一人物的主要作用是？", "options": [{"k": "A", "v": "作为女牢中的进步青年，参与狱中斗争与联络"}, {"k": "B", "v": "特务"}, {"k": "C", "v": "叛徒"}, {"k": "D", "v": "游击队员"}], "answer": "A", "analysis": "孙明霞是狱中女牢的进步青年，参与难友间的互助与斗争。", "ref": "回书指引：孙明霞：第11章与刘思扬共同被捕、第15章护理江姐、第26章藏纸条传情报。（原书第11、15、26章）"}, {"id": "q173", "type": "single", "cat": "event", "diff": 3, "stem": "小说中'绝食抗议'事件的直接起因是？", "options": [{"k": "A", "v": "龙光华被折磨致死，难友要求追悼会"}, {"k": "B", "v": "粮食短缺"}, {"k": "C", "v": "敌人殴打看守"}, {"k": "D", "v": "要求释放"}], "answer": "A", "analysis": "龙光华被迫害病逝后，难友以绝食抗争，迫使特务同意为其举行追悼会。", "ref": "回书指引：龙光华（原型龙光章）：第11章抄《囚歌》、第12章取水被打、第13章被迫害致死引发绝食斗争。（原书第11—13章）"}, {"id": "q174", "type": "single", "cat": "spirit", "diff": 3, "stem": "'狱中八条'对今天党的建设仍有启示，其根本原因是？", "options": [{"k": "A", "v": "它触及理想信念、领导作风、防腐败等根本性治党问题"}, {"k": "B", "v": "它是法律条文"}, {"k": "C", "v": "它已过时但具纪念意义"}, {"k": "D", "v": "它由中央直接发布"}], "answer": "A", "analysis": "'狱中八条'聚焦领导腐化、教育锻炼、作风整风等根本问题，是以刀刃向内的勇气自我净化的体现，至今仍有警示意义。", "ref": "回书指引：“狱中八条”出自罗广斌 1949.12.25 提交的《报告》第七部分，可结合第25—30章就义与越狱情节延伸阅读报告原文。（原书第25—30章（尾声反思））"}, {"id": "q175", "type": "single", "cat": "art", "diff": 2, "stem": "《红岩》中'红旗'意象（狱中缝制五星红旗）象征？", "options": [{"k": "A", "v": "对新中国的向往与必胜信念"}, {"k": "B", "v": "敌人旗帜"}, {"k": "C", "v": "普通布料"}, {"k": "D", "v": "商业符号"}], "answer": "A", "analysis": "狱中缝制五星红旗象征难友对新中国成立的欢欣与坚信黎明必至的信念。", "ref": "回书指引：1949.10.1 新中国成立，消息传到狱中后难友缝制五星红旗，见第25章。（原书第25章）"}, {"id": "q176", "type": "single", "cat": "basic", "diff": 3, "stem": "《红岩》中'中美合作所集中营'的文学处理，正确的认识是？", "options": [{"k": "A", "v": "借历史名词营造背景，不等于史料细节一一对应"}, {"k": "B", "v": "完全符合1949年史实"}, {"k": "C", "v": "是作者虚构的无中生有"}, {"k": "D", "v": "与重庆无关"}], "answer": "A", "analysis": "小说借'中美合作所集中营'这一广为人知的名词构建背景，但读者应区分文学背景与史实细节。", "ref": "回书指引：小说以“中美合作所集中营”为文学背景（史实机构已撤销），实际斗争舞台渣滓洞、白公馆见第11—30章。（原书第11—30章（集中营背景））"}, {"id": "q177", "type": "single", "cat": "event", "diff": 3, "stem": "重庆地下党组织遭破坏后，被关押在渣滓洞、白公馆的共产党员和革命志士达？", "options": [{"k": "A", "v": "300多人"}, {"k": "B", "v": "不足50人"}, {"k": "C", "v": "上千人"}, {"k": "D", "v": "10余人"}], "answer": "A", "analysis": "因叛徒出卖及武装斗争失败，被关押者达300多人，最终大多壮烈牺牲。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q178", "type": "single", "cat": "people", "diff": 3, "stem": "'老大哥'在狱中起到的作用是？", "options": [{"k": "A", "v": "以丰富经验与沉着成为难友的精神主心骨"}, {"k": "B", "v": "带头叛变"}, {"k": "C", "v": "消极绝望"}, {"k": "D", "v": "与敌人合作"}], "answer": "A", "analysis": "'老大哥'（夏老师）经验丰富、沉稳坚定，在狱中团结并鼓舞难友。", "ref": "回书指引：“老大哥”（夏老师）：第11—13章狱中难友主心骨、第26章建议讨论江姐遗书。（原书第11—13、26章）"}, {"id": "q179", "type": "single", "cat": "event", "diff": 2, "stem": "江姐就义前留给孩子的那句话（或遗书精神）常被概括为？", "options": [{"k": "A", "v": "'儿啊，盼教以踏着父母之足迹……'（革命自有后来人）"}, {"k": "B", "v": "'快投降吧'"}, {"k": "C", "v": "'忘记我们'"}, {"k": "D", "v": "'保全自己'"}], "answer": "A", "analysis": "江竹筠就义前给亲友留下遗书，嘱孩子'踏着父母之足迹'，体现革命信念的传承。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q180", "type": "fill", "cat": "basic", "diff": 2, "stem": "《红岩》成书约______万字，底稿近300万字。", "options": null, "answer": "40", "analysis": "《红岩》成书40万字，底稿近300万字，历经近10年打磨。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q181", "type": "fill", "cat": "event", "diff": 2, "stem": "江姐就义前留下遗书，嘱孩子'踏着父母之______'。", "options": null, "answer": "足迹", "analysis": "江竹筠遗书叮咛孩子继承父母革命之志。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q182", "type": "fill", "cat": "people", "diff": 2, "stem": "在狱中主动承认传阅《挺进报》以保护胡浩的人物是______。", "options": null, "answer": "齐晓轩", "analysis": "齐晓轩舍己护人，是白公馆斗争关键人物。", "ref": "回书指引：齐晓轩：第18章由老大哥介绍、第20—24章白公馆斗争、第22章保护胡浩担责、第28章筹划越狱、第30章断后挺立岩石牺牲。（原书第18、20—24、28、30章）"}, {"id": "q183", "type": "fill", "cat": "spirit", "diff": 2, "stem": "歌剧《江姐》中象征江姐品格的著名唱段是《______》。", "options": null, "answer": "红梅赞", "analysis": "《红梅赞》以红梅喻江姐高洁坚强。", "ref": "回书指引：江姐（原型江竹筠）：第3章接替刻写《挺进报》、第4章赴川北得知丈夫彭松涛牺牲、第14章被捕、第15章受“竹签钉指”酷刑、第21章识破敌特伪装、第25章绣红旗后从容就义。（原书第3—4、14—15、21、25章）"}, {"id": "q184", "type": "fill", "cat": "place", "diff": 2, "stem": "华蓥山游击纵队司令员'双枪老太婆'是______的母亲。", "options": null, "answer": "华为", "analysis": "双枪老太婆为华为母亲。", "ref": "回书指引：双枪老太婆（华为母亲、华蓥山纵队负责人）：第4章会见江姐、第14章营救江姐未及、第24章接受营救任务。（原书第4、14、24章）"}, {"id": "q185", "type": "judge", "cat": "basic", "diff": 2, "stem": "《红岩》从酝酿到成书历时近10年。", "options": null, "answer": "正确", "analysis": "正确。小说历经近10年、多次大改而成。", "ref": "回书指引：本书常识（作者、出版、成书）见序言、后记及文学史资料；全书共30章，建议先读第1—2章了解成书与时代背景。（原书第1—2章及序言）"}, {"id": "q186", "type": "judge", "cat": "people", "diff": 2, "stem": "刘思扬出身地主家庭，在狱中完成了思想上的自我改造。", "options": null, "answer": "正确", "analysis": "正确。刘思扬的形象体现从'小资情调'到革命者的蜕变。", "ref": "回书指引：刘思扬（原型刘国鋕）：第11—13章渣滓洞斗争与绝食、第18章被假意释放软禁、第19—24章转押白公馆完成思想蜕变。（原书第11—13、18—24章）"}, {"id": "q187", "type": "judge", "cat": "event", "diff": 3, "stem": "重庆地下党组织被破坏后，被关押者不足百人。", "options": null, "answer": "错误", "analysis": "错误。被关押在渣滓洞、白公馆的共产党员和革命志士达300多人。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q188", "type": "judge", "cat": "art", "diff": 2, "stem": "《红岩》塑造英雄群像而非单一主角，体现了集体主义创作取向。", "options": null, "answer": "正确", "analysis": "正确。小说以英雄集体取代个人英雄主义。", "ref": "回书指引：艺术特色需通读后体会，重点章：第1—10章（地下斗争）、第11—28章（狱中群像）、第29—30章（越狱迎解放）。（原书第1—30章）"}, {"id": "q189", "type": "judge", "cat": "spirit", "diff": 2, "stem": "'狱中八条'是烈士在牺牲前总结的、对党提的八条意见。", "options": null, "answer": "正确", "analysis": "正确。出自罗广斌报告第七部分，是血泪政治嘱托。", "ref": "回书指引：“狱中八条”出自罗广斌 1949.12.25 提交的《报告》第七部分，可结合第25—30章就义与越狱情节延伸阅读报告原文。（原书第25—30章（尾声反思））"}, {"id": "q190", "type": "judge", "cat": "people", "diff": 3, "stem": "历史上'甫志高'确有其人，且是重庆地下党市委书记。", "options": null, "answer": "错误", "analysis": "错误。甫志高是综合多个叛徒的艺术形象；真实叛徒中刘国定曾任市委书记。", "ref": "回书指引：甫志高：第1—2章擅自开沙坪书店、第5章引狼入室、第7章不听劝告、第8章叛变出卖同志、第14章出卖江姐，是全书矛盾引爆点。（原书第1—8、14章）"}, {"id": "q191", "type": "single", "cat": "people", "diff": 1, "stem": "小说中出身工人、历经毒刑仍坚贞不屈、与'老大哥'同狱的党员是？", "options": [{"k": "A", "v": "余新江"}, {"k": "B", "v": "成岗"}, {"k": "C", "v": "刘思扬"}, {"k": "D", "v": "华为"}], "answer": "A", "analysis": "余新江是工人党员，在狱中饱受折磨而信念不改，与'老大哥'等相互扶持。", "ref": "回书指引：余新江：第1章介绍特务纵火、第11—13章渣滓洞斗争、第21章识破敌特伪装、第29章越狱断后。（原书第1、11—13、21、29章）"}, {"id": "q192", "type": "single", "cat": "people", "diff": 2, "stem": "小说中出身农民、朴实刚强、在最后越狱中英勇牺牲的人物是？", "options": [{"k": "A", "v": "丁长发"}, {"k": "B", "v": "胡浩"}, {"k": "C", "v": "余新江"}, {"k": "D", "v": "孙明霞"}], "answer": "A", "analysis": "丁长发是农民党员，憨厚坚强，在集体越狱时为掩护同志牺牲。", "ref": "回书指引：丁长发：第11—13章渣滓洞农民党员群像、第29章集体越狱中掩护战友牺牲。（原书第11—13、29章）"}, {"id": "q193", "type": "single", "cat": "people", "diff": 2, "stem": "因被白公馆看守长发现阅读《挺进报》而遭毒打、被齐晓轩主动保护的人物是？", "options": [{"k": "A", "v": "胡浩"}, {"k": "B", "v": "余新江"}, {"k": "C", "v": "丁长发"}, {"k": "D", "v": "刘思扬"}], "answer": "A", "analysis": "胡浩因读《挺进报》受刑，齐晓轩主动担责保护了这位青年。", "ref": "回书指引：齐晓轩：第18章由老大哥介绍、第20—24章白公馆斗争、第22章保护胡浩担责、第28章筹划越狱、第30章断后挺立岩石牺牲。（原书第18、20—24、28、30章）"}, {"id": "q194", "type": "single", "cat": "people", "diff": 2, "stem": "在狱中被关押、曾教'小萝卜头'读书认字的爱国将领是？", "options": [{"k": "A", "v": "黄显声"}, {"k": "B", "v": "杨虎城"}, {"k": "C", "v": "叶挺"}, {"k": "D", "v": "张学良"}], "answer": "A", "analysis": "黄显声将军在狱中教小萝卜头识字，是真实史实。", "ref": "回书指引：“小萝卜头”宋振中：第20章在白公馆长大、由黄显声教识字、放飞小飞虫，是年龄最小的烈士。（原书第20章）"}, {"id": "q195", "type": "single", "cat": "people", "diff": 2, "stem": "小说中作为'劝降者'出现的特务文官形象是？", "options": [{"k": "A", "v": "沈养斋"}, {"k": "B", "v": "徐鹏飞"}, {"k": "C", "v": "毛人凤"}, {"k": "D", "v": "杨进兴"}], "answer": "A", "analysis": "沈养斋是小说中负责'攻心劝降'的特务文人形象。", "ref": "回书指引：沈养斋：第6章密报渗透消息、第9章参与攻心劝降的特务文人。（原书第6、9章）"}, {"id": "q196", "type": "single", "cat": "people", "diff": 1, "stem": "国民党保密局头子、小说中出场的最高特务长官是？", "options": [{"k": "A", "v": "毛人凤"}, {"k": "B", "v": "徐鹏飞"}, {"k": "C", "v": "杨进兴"}, {"k": "D", "v": "郑克昌"}], "answer": "A", "analysis": "毛人凤是国民党特务系统高层，在小说中作为最高长官出现。", "ref": "回书指引：毛人凤：第10章宣读嘉奖令、利诱许云峰技穷，是出场的最高特务长官。（原书第10章）"}, {"id": "q197", "type": "single", "cat": "people", "diff": 3, "stem": "《囚歌》'为人进出的门紧锁着……我应该在烈火与热血中得到永生'的作者是？", "options": [{"k": "A", "v": "叶挺"}, {"k": "B", "v": "陈然"}, {"k": "C", "v": "江竹筠"}, {"k": "D", "v": "许晓轩"}], "answer": "A", "analysis": "《囚歌》为叶挺将军所作，在渣滓洞等集中营中广为传诵，激励难友。", "ref": "回书指引：渣滓洞是狱中斗争主舞台：第11—16章断水、绝食、江姐受刑、新年联欢，第21—22章敌特渗透，第26章突击检查，第29章集体越狱。（原书第11—16、21—22、26、29章）"}, {"id": "q198", "type": "single", "cat": "people", "diff": 3, "stem": "杨虎城将军与下列哪位小烈士一家同时遇害？", "options": [{"k": "A", "v": "小萝卜头（宋振中）一家"}, {"k": "B", "v": "江姐"}, {"k": "C", "v": "许云峰"}, {"k": "D", "v": "成岗"}], "answer": "A", "analysis": "1949年9月6日，杨虎城将军与宋绮云、徐林侠及幼子宋振中（小萝卜头）同遭杀害。", "ref": "回书指引：“小萝卜头”宋振中：第20章在白公馆长大、由黄显声教识字、放飞小飞虫，是年龄最小的烈士。（原书第20章）"}, {"id": "q199", "type": "single", "cat": "people", "diff": 3, "stem": "许云峰原型之一、真实烈士许晓轩在狱中表现出的品格是？", "options": [{"k": "A", "v": "坚贞不屈、宁死不降"}, {"k": "B", "v": "主动叛变"}, {"k": "C", "v": "消极绝望"}, {"k": "D", "v": "投降当特务"}], "answer": "A", "analysis": "许晓轩是真实英烈，与许建业等共同构成许云峰形象，均坚贞不屈。", "ref": "回书指引：许云峰：第7章识破郑克昌、第8章被捕、第9章受审、第10章智对庆功宴、第12章抬入牢房高唱《国际歌》、第16章被转移、第24章地窖挖暗道、第28章从容就义。（原书第7—10、12、16、24、28章）"}, {"id": "q200", "type": "single", "cat": "event", "diff": 3, "stem": "小说背景中，川东地下党发动的武装斗争接连失败，史称？", "options": [{"k": "A", "v": "川东三次武装起义"}, {"k": "B", "v": "南昌起义"}, {"k": "C", "v": "秋收起义"}, {"k": "D", "v": "百色起义"}], "answer": "A", "analysis": "川东三次武装起义的失败是地下党组织受挫的重要背景，也是'狱中八条'反思的内容之一。", "ref": "回书指引：川东三次武装起义的失败是地下党受挫的重要背景，亦见第4章华蓥山线与“狱中八条”反思。（原书第4章及背景）"}, {"id": "q201", "type": "single", "cat": "event", "diff": 2, "stem": "许云峰原型之一许建业（化名杨清）就义于何时？", "options": [{"k": "A", "v": "1948年7月22日"}, {"k": "B", "v": "1949年11月14日"}, {"k": "C", "v": "1949年10月28日"}, {"k": "D", "v": "1948年4月1日"}], "answer": "A", "analysis": "许建业于1948年7月22日英勇就义，是重庆地下党工运重要领导人。", "ref": "回书指引：许云峰：第7章识破郑克昌、第8章被捕、第9章受审、第10章智对庆功宴、第12章抬入牢房高唱《国际歌》、第16章被转移、第24章地窖挖暗道、第28章从容就义。（原书第7—10、12、16、24、28章）"}, {"id": "q202", "type": "single", "cat": "event", "diff": 3, "stem": "'11·27'大屠杀之夜，打开牢门使罗广斌等约19人脱险的看守是？", "options": [{"k": "A", "v": "杨钦典"}, {"k": "B", "v": "杨进兴"}, {"k": "C", "v": "徐远举"}, {"k": "D", "v": "毛人凤"}], "answer": "A", "analysis": "看守杨钦典在攻心下弃暗投明，打开牢门使罗广斌等19人虎口脱险。", "ref": "回书指引：看守杨钦典在“11·27”之夜打开牢门、放走罗广斌等约19人，对应第28—30章越狱情节（史实人物）。（原书第28—30章（史实人物））"}, {"id": "q203", "type": "single", "cat": "place", "diff": 2, "stem": "八路军、中共中央南方局在重庆的办事处所在地，也是书名由来的是？", "options": [{"k": "A", "v": "红岩村"}, {"k": "B", "v": "渣滓洞"}, {"k": "C", "v": "白公馆"}, {"k": "D", "v": "歌乐山"}], "answer": "A", "analysis": "红岩村是抗战时期八路军重庆办事处、南方局所在地，书名即源于此。", "ref": "回书指引：红岩村是抗战时期八路军重庆办事处、南方局所在地，为书名来源，背景见第1章及书名寓意。（原书第1章（书名来源/背景））"}, {"id": "q204", "type": "single", "cat": "place", "diff": 2, "stem": "小说中华为就读、陈松林曾去送书的学校是？", "options": [{"k": "A", "v": "重庆大学"}, {"k": "B", "v": "沙坪坝中学"}, {"k": "C", "v": "中央大学"}, {"k": "D", "v": "复旦大学"}], "answer": "A", "analysis": "重庆大学是华为等进步青年活动的重要场景。", "ref": "回书指引：华为：第2章送《挺进报》、第4章陪江姐入川北、第14章报信、第24章华蓥山纵队准备营救。（原书第2、4、14、24章）"}, {"id": "q205", "type": "single", "cat": "place", "diff": 3, "stem": "杨虎城将军与小萝卜头一家遇害的地点（史实）是？", "options": [{"k": "A", "v": "戴公祠"}, {"k": "B", "v": "渣滓洞 function topStats(){
  const t={},c={},d={};

  const html=[
    stat(DATA.length,"总题数"),
    stat(t.single||0,"单选"),stat(t.multiple||0,"多选"),
    stat(t.fill||0,"填空"),stat(t.judge||0,"判断"),stat(t.short||0,"简答")
  ].join("");
  document.getElementById("topstats").innerHTML=html;
}
function stat(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'}

function render(){
  let list=DATA.filter(q=>{
    if(state.type!=="all"&&q.type!==state.type)return false;
    if(state.cat!=="all"&&q.cat!==state.cat)return false;
    if(state.diff!=="all"&&String(q.diff)!==state.diff)return false;
    if(state.wrongOnly&&!isWrong(q.id))return false;
    return true;
  });
  if(state.shuffle)list=shuffle(list.slice());
  curList=list;
  const box=document.getElementById("list");
  if(!list.length){box.innerHTML='<div class="empty">没有符合条件的题目</div>';updateCount();return}
  box.innerHTML=list.map((q,i)=>card(q,i)).join("");
  updateCount();
}

    body='<div class="opts" data-multi="'+multi+'">'+opts+'</div><button class="submit" data-id="'+q.id+'">提交</button>';
  }else if(q.type==="fill"){
    body='<input class="fillin" placeholder="请输入答案"><button class="submit" data-id="'+q.id+'">提交</button>';
  }else if(q.type==="judge"){
    body='<div class="opts" data-multi="0"><button class="opt" data-k="T">正确（√）</button><button class="opt" data-k="F">错误（×）</button></div><button class="submit" data-id="'+q.id+'">提交</button>';
  }else if(q.type==="short"){
    body='<button class="reveal" data-id="'+q.id+'">显示参考答案</button>';
  }
  const stemHtml=q.type==="fill"?esc(q.stem).replace(/_{2,}/g,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>'):esc(q.stem);
  return '<div class="qcard" data-id="'+q.id+'" data-done="0">'+
    '<div class="qhead"><span class="tag t">'+tn+'</span><span class="tag">'+cn+'</span>'+
    '<span class="tag d'+q.diff+'">'+dn+'</span><span class="qno">第 '+(i+1)+' 题</span></div>'+
    '<div class="stem">'+stemHtml+'</div>'+body+
    '<div class="fb" id="fb-'+q.id+'"></div></div>';
}

function grade(q,cardEl){
  const fb=cardEl.querySelector(".fb");
  let ok=false,ansText="";
  if(q.type==="single"){
    const sel=cardEl.querySelector(".opt.sel");
    if(!sel){alert("请先选择一个选项");return}
    const k=sel.dataset.k;
    ok=(k===q.answer);
    cardEl.querySelectorAll(".opt").forEach(o=>{
      if(o.dataset.k===q.answer)o.classList.add("right");
      else if(o===sel&&!ok)o.classList.add("wrong");
    });
    ansText="正确答案："+q.answer;
  }else if(q.type==="multiple"){
    const sels=[...cardEl.querySelectorAll(".opt.sel")].map(o=>o.dataset.k);
    const cor=q.answer.slice().sort().join("");
    const got=sels.slice().sort().join("");
    ok=(cor===got);
    cardEl.querySelectorAll(".opt").forEach(o=>{
      if(q.answer.includes(o.dataset.k))o.classList.add("right");
      else if(o.classList.contains("sel"))o.classList.add("wrong");
    });
    ansText="正确答案："+q.answer.join("、");
  }else if(q.type==="fill"){
    const inp=cardEl.querySelector(".fillin");
    const v=(inp.value||"").trim();
    ok=(norm(v)===norm(q.answer));
    inp.style.borderColor=ok?"var(--grn)":"#d9534f";
    ansText="参考答案："+esc(q.answer);
  }else if(q.type==="judge"){
    const sel=cardEl.querySelector(".opt.sel");
    if(!sel){alert("请先选择");return}
    ok=(sel.dataset.k===(q.answer?"T":"F"));
    cardEl.querySelectorAll(".opt").forEach(o=>{
      if((o.dataset.k==="T")===q.answer)o.classList.add("right");
      else if(o===sel&&!ok)o.classList.add("wrong");
    });
    ansText="正确答案："+(q.answer?"正确":"错误");
  }
  answered[q.id]=ok;saveStore();
  const res=ok?'<div class="res" style="color:var(--grn)">✓ 回答正确</div>':'<div class="res" style="color:#b3243a">✗ 回答错误</div>';
  fb.innerHTML=res+'<div class="ans">'+ansText+'</div><div class="an"><b>解析：</b>'+esc(q.analysis)+'</div>'+(q.ref?'<div class="ref"><b>回书指引：</b>'+esc(q.ref)+'</div>':'');
  fb.className="fb show "+(ok?"ok":"no");
  cardEl.dataset.done="1";
  updateCount();
}

function norm(s){return (s||"").trim().replace(/\s+/g,"").toLowerCase()}

function revealShort(btn){
  const q=byId(btn.dataset.id);const cardEl=btn.closest(".qcard");const fb=cardEl.querySelector(".fb");
  fb.innerHTML='<div class="ans"><b>参考答案：</b></div><div class="an">'+esc(q.answer)+'</div><div class="an"><b>解析：</b>'+esc(q.analysis)+'</div>'+(q.ref?'<div class="ref"><b>回书指引：</b>'+esc(q.ref)+'</div>':'');
  fb.className="fb show";btn.style.display="none";answered[q.id]=true;saveStore();updateCount();
}

function updateCount(){
  const ids=curList.map(q=>q.id);
  const graded=ids.filter(id=>answered[id]!==undefined&&DATA.find(q=>q.id===id).type!=="short");
  const right=graded.filter(id=>answered[id]===true).length;
  const rate=graded.length?Math.round(right/graded.length*100):0;
  const wrongN=ids.filter(id=>isWrong(id)).length;
  document.getElementById("foot").textContent=
    "本页 "+ids.length+" 题 · 已作答(可判) "+graded.length+" · 正确 "+right+" · 正确率 "+rate+"% · 错题 "+wrongN+
    " · 总题数 "+DATA.length;
}

document.getElementById("list").addEventListener("click",e=>{
  const opt=e.target.closest(".opt");
  if(opt){
    const card=opt.closest(".qcard");
    if(card.dataset.done==="1")return;
    const opts=opt.parentElement;
    if(opts.dataset.multi==="1")opt.classList.toggle("sel");
    else{[...opts.children].forEach(o=>o.classList.remove("sel"));opt.classList.add("sel");}
    return;
  }
  const sub=e.target.closest(".submit");
  if(sub){grade(byId(sub.dataset.id),sub.closest(".qcard"));return;}
  const rev=e.target.closest(".reveal");
  if(rev){revealShort(rev);return;}
});

topStats();render();
</script>
